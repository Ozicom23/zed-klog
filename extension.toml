id = "klog"
name = "klog"
description = "Support for klog, the plain-text time tracking format."
version = "0.1.0"
schema_version = 1
authors = ["Ozicom23"]
repository = "https://github.com/Ozicom23/zed-klog"

# The grammar lives in this repository, in `tree-sitter-klog`. Zed checks out
# `rev` from `repository` and compiles the parser from there, so `rev` must be
# a pushed commit that contains the grammar changes you want to use.
#
# To try unpushed grammar changes, temporarily point `repository` to your local
# clone, e.g. "file:///path/to/zed-klog".
[grammars.klog]
repository = "https://github.com/Ozicom23/zed-klog"
rev = "6c2f758dd3628a3086c05798a527e9afe5f3f600"
path = "tree-sitter-klog"

# The language server lives in `klog-ls`. The extension (src/lib.rs) uses the
# binary set in the `lsp.klog-ls.binary.path` setting, else `klog-ls` from the
# PATH, else downloads it from the latest GitHub release.
[language_servers.klog-ls]
name = "klog-ls"
languages = ["klog"]
